<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jagger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%231d5c63%22/%3E%3Cg%20transform%3D%22translate%28-1.5%201.5%29%22%3E%3Cpath%20d%3D%22M29.5%2014.5h21%22%20stroke%3D%22%23f2b544%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M42.5%2015%20L34.6%2042.6%20a5.2%205.2%200%200%201%20-8.8%201.9%20L18%2035.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#e9edf1; --surface:#ffffff; --surface-2:#f5f7f9; --border:#dbe1e7; --border-strong:#c3ccd5;
  --text:#1b2430; --muted:#5a6676; --faint:#8893a1;
  --accent:#1d5c63; --accent-hover:#164a50; --accent-soft:#e2eff0; --on-accent:#ffffff;
  --p1:#c42b2b; --p1-soft:#fbe9e9; --p2:#b56d12; --p2-soft:#fbf0de; --p3:#2c64a8; --p3-soft:#e6eef8;
  --ok:#2c7a4b; --ok-soft:#e3f2e8; --danger:#c42b2b;
  --shadow-sm:0 1px 2px rgba(20,30,45,.07);
  --shadow:0 2px 6px rgba(20,30,45,.10);
  --shadow-lg:0 24px 48px -12px rgba(20,30,45,.35);
  color-scheme:light;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#13171c; --surface:#1b2027; --surface-2:#21272f; --border:#2c333c; --border-strong:#3a434e;
    --text:#e5e9ee; --muted:#a2acb8; --faint:#77818d;
    --accent:#4fa3ab; --accent-hover:#68b6bd; --accent-soft:#1c2f32; --on-accent:#0c1a1c;
    --p1:#ef6f6f; --p1-soft:#3a2023; --p2:#e2a650; --p2-soft:#372b18; --p3:#6fa6e6; --p3-soft:#1b293a;
    --ok:#62bd86; --ok-soft:#17301f; --danger:#ef6f6f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 2px 8px rgba(0,0,0,.35); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;flex:none;display:block}
.brand-name{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{border-color:transparent;background:transparent;color:var(--danger)}
.btn.danger-ghost:hover{background:var(--p1-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.btn.icon-only{padding:0;width:34px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:28px;height:28px;border:0;background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.sm{width:22px;height:22px}
.lang{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;height:34px}
.lang button{border:0;background:transparent;padding:0 11px;cursor:pointer;font-weight:650;font-size:12px;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--on-accent)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);padding:6px;width:280px;z-index:40}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu-note{padding:9px 10px 5px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:4px;line-height:1.45}

.timer-pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;border-radius:999px;background:var(--p1-soft);color:var(--p1);font-weight:600;font-size:13px;max-width:380px;min-width:0}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--p1);animation:pulse 1.4s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
.pill-task{border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding:0}
.pill-task:hover{text-decoration:underline}
.pill-clock{font-variant-numeric:tabular-nums}
.pill-stop{width:26px;height:26px;border-radius:50%;border:0;background:var(--p1);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface)}
.search{position:relative}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{padding-left:32px;width:250px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{height:34px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
select{padding-right:6px}
.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.stat{display:inline-flex;align-items:baseline;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:12px;color:var(--muted);align-items:center}
.stat b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--border-strong)}
.stat.alert b{color:var(--p1)}
button.stat.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.clear-filters{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:0 6px;height:32px}
.clear-filters:hover{text-decoration:underline}

/* ---------- boards ---------- */
.boards{flex:1;display:flex;gap:14px;padding:16px 20px 20px;overflow-x:auto;overflow-y:hidden;align-items:stretch;min-height:0}
.col{flex:0 0 304px;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-top:4px solid var(--col);border-radius:8px;max-height:100%;min-height:0}
.col-head{padding:10px 12px 8px;background:linear-gradient(var(--col-soft),transparent);border-radius:4px 4px 0 0}
.col-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.col-title{font-size:14.5px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-count{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums;flex:none}
.badge-std{font-size:11px;color:var(--faint);font-weight:600;flex:none}
.col-title-row .icon-btn{margin-left:auto}
.col-desc{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.wip-warn{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;color:var(--p1);background:var(--p1-soft);padding:5px 8px;border-radius:5px}
.col.wip-over{border-color:var(--p1);border-top-color:var(--col)}
.col-body{flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:64px}
.col.drag-over{border-color:var(--accent);border-top-color:var(--col)}
.drop-marker{height:3px;border-radius:2px;background:var(--accent);flex:none;margin:-2px 0}
.quick-add{padding:0 10px 10px}
.quick-add input{width:100%;background:transparent;border:1px dashed var(--border-strong)}
.quick-add input:focus{background:var(--surface);border-style:solid}
.col-add{flex:0 0 200px;height:110px;border:2px dashed var(--border-strong);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.col-add:hover{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.empty{font-size:12px;color:var(--faint);text-align:center;padding:16px 0;border:1px dashed var(--border);border-radius:6px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--pc);border-radius:6px;padding:9px 10px 10px;box-shadow:var(--shadow-sm);cursor:pointer;flex:none}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-strong);border-left-color:var(--pc)}
.p1{--pc:var(--p1);--ps:var(--p1-soft)} .p2{--pc:var(--p2);--ps:var(--p2-soft)} .p3{--pc:var(--p3);--ps:var(--p3-soft)}
.card.dragging{opacity:.4}
.card.is-done{opacity:.75}
.card.is-done .card-title{text-decoration:line-through;color:var(--muted)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;min-height:24px}
.prio{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--ps);color:var(--pc)}
.card-num{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.blocked-tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--p1);background:var(--p1-soft);padding:1px 6px;border-radius:4px}
.timer-btn{margin-left:auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s}
.card:hover .timer-btn,.timer-btn.running,.timer-btn:focus-visible{opacity:1}
.timer-btn:hover{color:var(--accent);border-color:var(--accent)}
.timer-btn.running{background:var(--p1);border-color:var(--p1);color:#fff}
.card-title{font-size:13.5px;font-weight:600;margin:0;line-height:1.35;word-break:break-word}
.card-block-reason{margin:5px 0 0;font-size:12px;color:var(--p1);line-height:1.35;word-break:break-word}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.card-meta:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.overdue{color:#fff;background:var(--p1);border-color:var(--p1)}
.chip.today,.chip.soon{color:var(--p2);background:var(--p2-soft);border-color:transparent;font-weight:600}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.live{color:var(--p1);background:var(--p1-soft);border-color:transparent;font-weight:600}
.chip.over{color:var(--p1)}
.mini-progress{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
.mini-progress span{display:block;height:100%;background:var(--ok)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,22,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow-lg);width:100%;max-width:1000px;display:flex;flex-direction:column;max-height:92vh}
.board-modal{max-width:520px}
.modal-head{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px}
.head-num{font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.head-board{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--col);flex:none}
.modal-body{overflow-y:auto;padding:18px 20px 22px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--border)}
.spacer{flex:1}
.saved-hint{font-size:12px;color:var(--faint)}
.tm-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:26px}
.title-input{width:calc(100% + 16px);font-size:21px;font-weight:650;border:1px solid transparent!important;height:auto!important;padding:5px 8px!important;margin:-5px -8px 4px;background:transparent!important;box-shadow:none!important;border-radius:6px}
.title-input:hover{border-color:var(--border)!important}
.title-input:focus{border-color:var(--accent)!important;background:var(--surface)!important}
.lbl{display:block;font-size:12px;font-weight:650;color:var(--muted);margin:14px 0 5px}
.tm-main textarea{width:100%}
.sec{margin-top:24px}
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted)}
.sec-head h4{margin:0;font-size:14px;font-weight:700;color:var(--text)}
.sec-head .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress span{display:block;height:100%;background:var(--ok);transition:width .2s}
.subtasks{list-style:none;margin:0 0 6px;padding:0}
.subtasks li{display:flex;align-items:center;gap:8px;padding:1px 0}
.subtasks input[type=checkbox]{width:17px;height:17px;accent-color:var(--ok);cursor:pointer;flex:none;margin:0}
.sub-text{flex:1;border-color:transparent!important;height:30px!important;background:transparent!important;box-shadow:none!important}
.sub-text:hover{border-color:var(--border)!important}
.sub-text:focus{border-color:var(--accent)!important;background:var(--surface)!important}
.subtasks li.done .sub-text{text-decoration:line-through;color:var(--muted)}
.add-input{width:100%}
.note-add{display:flex;gap:8px;align-items:flex-end}
.note-add textarea{flex:1}
.notes{list-style:none;padding:0;margin:10px 0 0}
.notes li{border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:8px;background:var(--surface-2)}
.note-meta{display:flex;align-items:center;font-size:11.5px;color:var(--faint);margin-bottom:3px}
.note-meta .icon-btn{margin-left:auto}
.note-text{white-space:pre-wrap;word-break:break-word;line-height:1.45}
.hint{font-size:11.5px;color:var(--faint);margin-top:4px}

.tm-side .lbl:first-child{margin-top:0}
.tm-side select,.tm-side input[type=date],.tm-side input[type=number],.tm-side textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg-btn{flex:1;height:32px;border:0;background:var(--surface);cursor:pointer;font-weight:700;color:var(--muted);border-right:1px solid var(--border-strong)}
.seg-btn:last-child{border-right:0}
.seg-btn:hover{color:var(--pc)}
.seg-btn.on{background:var(--pc);color:#fff}
.prio-desc{font-size:12px;color:var(--muted);margin-top:5px}
.due-info{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:5px;color:var(--muted)}
.due-info:empty{display:none}
.due-info.overdue{color:var(--p1)} .due-info.today,.due-info.soon{color:var(--p2)}
.side-block{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:16px}
.side-block.blocked{background:var(--p1-soft);border-color:transparent}
.side-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:650;font-size:13px;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:36px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s;flex:none}
.track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--p1)}
.switch input:checked+.track::after{left:18px}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.side-block textarea{margin-top:10px}
.big-clock{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0 10px}
.big-clock.running{color:var(--p1)}
.est{margin-top:10px}
.bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.over span{background:var(--p1)}
.est-text{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.est-text.over{color:var(--p1);font-weight:600}
details.manual summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;margin-top:12px}
.man-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.man-row input[type=date]{flex:1 1 100%}
.man-row input[type=number]{width:62px!important}
.entries{list-style:none;padding:0;margin:12px 0 0;max-height:190px;overflow-y:auto;font-size:12px}
.entries li{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--border)}
.entries em{color:var(--faint);font-style:normal}
.entries .dur{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.75}
.meta b{font-weight:600;color:var(--text)}

.form input[type=text],.form input[type=number],.form textarea{width:100%}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--sw);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--text)}
input[type=color]{width:44px;height:30px;padding:2px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);cursor:pointer}
.check{display:flex;align-items:center;gap:9px;margin-top:16px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.order-row{display:flex;align-items:center;gap:8px;margin-top:16px}
.order-row .lbl{margin:0 auto 0 0}
.preview{margin-top:18px;border:1px solid var(--border);border-top:4px solid var(--col);border-radius:8px;background:var(--surface-2);padding:10px 12px}
.preview .col-title{font-size:14px}

/* ---------- backup ---------- */
.badge-dot{width:8px;height:8px;border-radius:50%;background:var(--p2);flex:none}
.backup-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 20px;background:var(--p2-soft);border-bottom:1px solid var(--border);font-size:13px}
.backup-bar>.ic{color:var(--p2)}
.backup-bar.paused{background:var(--p1-soft)}
.backup-bar.paused>.ic{color:var(--p1)}
.backup-bar .msg{flex:1;min-width:200px;font-weight:550}
.backup-modal{max-width:640px}
.bk-intro{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.bk-status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;background:var(--ok-soft);color:var(--ok);font-weight:650}
.bk-status.warn{background:var(--p2-soft);color:var(--p2)}
.bk-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.bk-sec h4{margin:0 0 4px;font-size:14px}
.bk-p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.5}
.bk-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.auto-state{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;margin-bottom:12px;line-height:1.45}
.auto-state .dot{margin-top:5px}
.auto-state.ok{color:var(--ok)} .auto-state.ok .dot{background:var(--ok)}
.auto-state.paused,.auto-state.error{color:var(--p1)} .auto-state.paused .dot,.auto-state.error .dot{background:var(--p1)}
.bk-tip{font-size:12px;color:var(--faint);margin:10px 0 0;line-height:1.45}

.hist{display:flex;gap:4px}
.toast.has-action{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast-btn{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.vlist{border:1px solid var(--border);border-radius:8px;max-height:290px;overflow-y:auto;margin-top:12px}
.vday+.vday{border-top:1px solid var(--border)}
.vday summary{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-weight:650;font-size:13px;background:var(--surface-2);list-style:none}
.vday summary::-webkit-details-marker{display:none}
.vday summary::before{content:'';width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
.vday[open] summary::before{transform:rotate(45deg)}
.vday-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.vrow{display:grid;grid-template-columns:50px 1fr auto auto;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--border);font-size:13px}
.vtime{font-weight:650;font-variant-numeric:tabular-nums}
.vtype{color:var(--muted)}
.vcount{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.two-sel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two-sel select{width:100%}
@media (max-width:560px){.vrow{grid-template-columns:50px 1fr auto}.vcount{display:none}.two-sel{grid-template-columns:1fr}}
/* ---------- sync ---------- */
.sync-modal{max-width:800px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-6px 0 18px}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:650;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.sync-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
.qr-stage{background:#fff;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;padding:12px;aspect-ratio:1/1;color:#5a6676}
.qr-stage canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.qr-meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qr-progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.qr-progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.opt{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:2px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:400}
.steps{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.55}
.steps li{margin-bottom:4px}
.drop{border:2px dashed var(--border-strong);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;color:var(--text);font-size:15px;margin:8px 0 4px}
.scan-status{margin-top:12px;font-size:13px}
.scan-status .line{display:flex;gap:8px;align-items:center;padding:4px 0}
.scan-status .line.err{color:var(--p1)} .scan-status .line.warn{color:var(--p2)}
.chunks{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.chunks i{width:14px;height:14px;border-radius:3px;background:var(--border)}
.chunks i.ok{background:var(--ok)}
.pending{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:14px;background:var(--surface-2)}
.pending.done{background:var(--ok-soft);border-color:transparent}
.pending h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.nums{display:flex;gap:22px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}
.nums b{display:block;font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}
.warn-box{display:flex;gap:8px;align-items:flex-start;background:var(--p2-soft);color:var(--p2);border-radius:7px;padding:8px 10px;font-size:13px;margin:0 0 10px}
@media (max-width:760px){.sync-grid{grid-template-columns:1fr}}
/* ---------- sprints ---------- */
#sprintSel.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sprint-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 20px;background:var(--accent-soft);border-bottom:1px solid var(--border)}
.sprint-bar.closed{background:var(--surface-2)}
.sb-main{flex:1;min-width:240px}
.sb-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--accent)}
.sb-title b{color:var(--text);font-size:15px}
.sb-meta{color:var(--muted);font-size:13px}
.sb-goal{font-size:13px;margin-top:3px}
.sb-prog{width:230px}
.sb-nums{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.sb-actions{display:flex;gap:6px}
.sb-prog .bar span,.sp-prog .bar span{background:var(--ok)}
.sp-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.sp-badge.active{background:var(--ok);color:#fff}
.sp-badge.planned{background:var(--p3-soft);color:var(--p3)}
.sp-badge.closed{background:var(--border);color:var(--muted)}
.sprint-modal{max-width:780px}
.sprint-modal .modal-head{color:var(--accent)}
.sprint-modal .modal-head h3{color:var(--text)}
.sp-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.sp-top .bk-p{flex:1}
.sp-list{display:flex;flex-direction:column;gap:10px}
.sp-item{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:14px;align-items:center;border:1px solid var(--border);border-left:4px solid var(--p3);border-radius:8px;padding:12px 14px;background:var(--surface)}
.sp-item.active{border-left-color:var(--ok)}
.sp-item.closed{border-left-color:var(--border-strong)}
.sp-name{font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-meta{font-size:12px;color:var(--muted);margin-top:3px}
.sp-goal{font-size:13px;margin-top:4px}
.sp-actions{display:flex;gap:6px}
.sp-form{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:4px}
.sp-form .span2{grid-column:1/-1}
.sp-form input,.sp-form textarea{width:100%}
.sp-status{display:flex;align-items:center;gap:10px;margin:16px 0 0;flex-wrap:wrap}
.sp-nums{margin:14px 0}
.sp-h{margin:22px 0 8px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.sp-tasks{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;max-height:300px;overflow-y:auto;background:var(--surface)}
.sp-tasks .empty{border:0}
.sp-task{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--border);font-size:13px}
.sp-task:first-child{border-top:0}
.sp-task.done .sp-task-title{text-decoration:line-through;color:var(--muted)}
.sp-task-title{flex:1;min-width:0;text-align:left;border:0;background:transparent;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.sp-task-title:hover{color:var(--accent);text-decoration:underline}
.sp-task-board{font-size:12px;color:var(--muted);white-space:nowrap}
.sp-search{margin-bottom:8px}
.sp-search input{width:100%}
.burndown{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.bd-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:4px;color:var(--muted)}
.bd-head b{color:var(--text)}
.bd-key{display:inline-block;width:14px;height:3px;border-radius:2px;margin:0 4px 2px 10px;vertical-align:middle}
.bd-key.ideal{background:var(--border-strong)} .bd-key.real{background:var(--accent)}
.burndown svg{width:100%;height:auto;display:block}
.bd-grid{stroke:var(--border);stroke-width:1}
.bd-ideal{stroke:var(--border-strong);stroke-width:2;stroke-dasharray:5 4}
.bd-real{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.bd-dot{fill:var(--accent)}
.bd-txt{font-size:11px;fill:var(--muted);font-family:inherit}
.chip.sprint{color:var(--accent);background:var(--accent-soft);border-color:transparent}
@media (max-width:700px){.sp-item{grid-template-columns:1fr}.sp-form{grid-template-columns:1fr}.sb-prog{width:100%}.sp-top{flex-direction:column}}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:7px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100;font-weight:550;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translate(-50%,0)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:980px){
  .btn .t{display:none}
  .btn:not(.icon-only){padding:0 10px}
  .stats{margin-left:0}
}
@media (max-width:820px){
  .tm-grid{grid-template-columns:1fr}
  .brand-sub{display:none}
  .search input{width:180px}
}
</style>

    <div><div class="brand-name">Jagger</div><div class="brand-sub" data-i18n="appSub"></div></div>
  </div>
  <div id="timerPill" class="timer-pill" hidden></div>
  <div class="top-actions">
    <div class="hist"><button class="btn icon-only" data-act="undo" data-ic="undo" data-i18n-title="undoHint" disabled></button><button class="btn icon-only" data-act="redo" data-ic="redo" data-i18n-title="redoHint" disabled></button></div>
    <button class="btn primary" data-act="new-task" data-ic="plus" data-i18n-title="newTaskHint"><span class="t" data-i18n="newTask"></span></button>

    <button class="btn" data-act="export" data-ic="sheet" data-i18n-title="exportExcel"><span class="t" data-i18n="exportExcel"></span></button>
    <button class="btn" data-act="open-sync" data-ic="phone" data-i18n-title="syncTitle"><span class="t" data-i18n="syncBtn"></span></button>
    <button class="btn" data-act="open-backup" data-ic="shield" data-i18n-title="backupTitle"><span class="t" data-i18n="backupBtn"></span><span class="badge-dot" id="bkDot" hidden></span></button>
    <div class="lang" role="group" aria-label="Language / Sprache">

</header>

<div class="toolbar">
  <div class="search"><span data-ic="search"></span><input id="search" type="search" data-i18n-ph="search" autocomplete="off"></div>

  <select id="prioFilter" data-i18n-title="priority"></select>
  <select id="sortSel" data-i18n-title="sortBy"></select>
  <div class="stats" id="stats"></div>
</div>
<div class="backup-bar" id="backupBar" role="status" hidden></div>
<div class="sprint-bar" id="sprintBar" hidden></div>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

/* ---------------- modal close ---------------- */
function closeModal() {
  stopAnim();
  if (modalKind === 'task' && newTaskId) {
    const x = getTask(newTaskId);
    if (x && !x.title.trim() && !x.description.trim() && !x.subtasks.length && !x.notes.length && !x.time.length && state.activeTimer?.taskId !== x.id)
    {
      state.tasks = state.tasks.filter(y => y !== x);
      if (undoLenAtNew >= 0) { undoStack.length = Math.min(undoStack.length, undoLenAtNew); lastData = dataOf(state); }
    }
  }
  undoLenAtNew = -1;
  newTaskId = null; openTaskId = null; editingBoardId = null; modalKind = null;
  $('#modalRoot').innerHTML = '';
  save(); render();
}

/* ---------------- actions ---------------- */
function newTask() {
  const b = state.boards.find(x => x.key === 'todo') || state.boards.find(x => !x.isDone) || state.boards[0];
  if (saveTimer) save();
  undoLenAtNew = undoStack.length;

}
function setLang(l) {
  if (!I18N[l]) return;

  if (modalKind === 'task') renderTaskModal();
  else if (modalKind === 'board') openBoardModal(editingBoardId);
  else if (modalKind === 'backup') renderBackupModal();

}
let downOnOverlay = false;

function handleAct(act, id, el, e) {
  const x = openTaskId ? getTask(openTaskId) : null;
  switch (act) {
    case 'new-task': newTask(); break;
    case 'new-board': openBoardModal(); break;
    case 'edit-board': openBoardModal(id); break;
    case 'export': exportExcel(); break;
    case 'open-backup': renderBackupModal(); break;
    case 'open-sync': openSync('send'); break;
    case 'open-sprints': openSprints('list'); break;
    case 'sprint-new': { const sp = newSprint(); save(); render(); openSprints('detail', sp.id); break; }
    case 'sprint-open': openSprints('detail', id); break;
    case 'sprint-back': sprintUI.view = 'list'; renderSprintModal(); break;
    case 'sprint-show': state.ui.sprint = id; if (modalKind) closeModal(); else { render(); saveSoon(); } break;
    case 'sprint-start': { const sp = getSprint(id); if (sp) startSprint(sp); if (modalKind === 'sprints') renderSprintModal(); break; }

    case 'sprint-complete-go': {
      const sp = getSprint(sprintUI.id); if (!sp) break;
      const sel = $('#sp-move'), next = $('#sp-startnext');
      completeSprint(sp, sel ? sel.value : '', next ? next.checked : false); closeModal(); break; }
    case 'sprint-reopen': {
      const sp = getSprint(id), other = activeSprint();
      if (other && other !== sp) { toast(t('sprintOneActive', {name:other.name})); break; }
      if (sp) { sp.status = 'active'; sp.closedAt = null; sp.result = null; save(); render(); renderSprintModal(); }
      break; }
    case 'sprint-delete': { const sp = getSprint(id); if (sp) deleteSprint(sp); break; }
    case 'sprint-add-task': case 'sprint-remove-task': {
      const x = getTask(id); if (!x) break;
      x.sprintId = act === 'sprint-add-task' ? sprintUI.id : ''; touch(x); save(); render(); renderSprintModal(); break; }
    case 'sync-tab': if (id !== syncUI.tab) { stopAnim(); syncUI.tab = id; if (id === 'send') { syncUI.full = !canDelta(); prepareSend(); } else renderSyncModal(); } break;
    case 'sync-pause': syncUI.paused = !syncUI.paused; renderSyncModal(); break;
    case 'sync-save-img': saveSyncImage(); break;
    case 'sync-pick': $('#syncFile').click(); break;
    case 'sync-apply': applyPending('merge'); break;
    case 'sync-replace': applyPending('replace'); break;
    case 'sync-discard': syncUI.pending = null; renderSyncModal(); break;
    case 'backup-now': saveBackupNow(); break;
    case 'restore': $('#fileInput').click(); break;
    case 'auto-setup': setupAutoBackup(); break;
    case 'auto-resume': resumeAutoBackup(); break;
    case 'auto-off': disableAutoBackup(); break;
    case 'snooze-backup': state.backup.snoozeUntil = Date.now() + 86400000; persist(); renderBackupBar(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'version-now': if (saveTimer) save(); addVersion('manual', dataOf(state)).then(ok => ok && toast(t('vCreated'))); break;
    case 'restore-version': restoreVersion(id); break;
    case 'set-lang': setLang(id); break;
    case 'filter-p1': state.ui.prio = state.ui.prio === '1' ? 'all' : '1'; syncToolbar(); render(); saveSoon(); break;
    case 'filter-overdue': state.ui.onlyOverdue = !state.ui.onlyOverdue; render(); saveSoon(); break;
    case 'filter-bottleneck': state.ui.onlyBottleneck = !state.ui.onlyBottleneck; render(); saveSoon(); break;
    case 'clear-filters': Object.assign(state.ui, {prio:'all', onlyOverdue:false, onlyBottleneck:false, search:''}); syncToolbar(); render(); saveSoon(); break;
    case 'start-timer': startTimer(id); break;
    case 'stop-timer': stopTimer(); refreshAll(); break;
    case 'open-task': if (modalKind) closeModal(); openTask(id); break;
    case 'close-modal': closeModal(); break;
    case 'overlay-close': if (e.target === el && downOnOverlay) closeModal(); break;
    case 'set-prio': if (x) { x.priority = +id; touch(x); save(); refreshAll(); } break;
    case 'toggle-sub': if (x) { const s = x.subtasks.find(s => s.id === id); if (s) { s.done = el.checked; touch(x); save(); refreshAll(); } } break;
    case 'del-sub': if (x) { x.subtasks = x.subtasks.filter(s => s.id !== id); touch(x); save(); refreshAll(); } break;
    case 'add-note': if (x) addNote(x); break;
    case 'del-note': if (x) { x.notes = x.notes.filter(n => n.id !== id); touch(x); save(); refreshAll(); } break;
    case 'add-time': if (x) addManualTime(x); break;
    case 'del-time': if (x) { x.time = x.time.filter(en => en.id !== id); touch(x); save(); refreshAll(); } break;
    case 'delete-task':
      if (x && confirm(t('confirmDeleteTask', {name: x.title || t('untitled')}))) {
        if (state.activeTimer?.taskId === x.id) state.activeTimer = null;
        state.tasks = state.tasks.filter(y => y !== x); newTaskId = null;
        closeModal(); toast(t('taskDeleted'), true);
      } break;
    case 'pick-color': $('#b-color').value = id; updateBoardPreview(); break;
    case 'save-board': saveBoard(); break;
    case 'board-left': case 'board-right': {
      const b = getBoard(editingBoardId), i = state.boards.indexOf(b), j = act === 'board-left' ? i - 1 : i + 1;
      if (b && j >= 0 && j < state.boards.length) {
        [state.boards[i], state.boards[j]] = [state.boards[j], state.boards[i]];
        save(); renderBoards();
        $('[data-act="board-left"]').disabled = j === 0;
        $('[data-act="board-right"]').disabled = j === state.boards.length - 1;
      } break; }
    case 'reset-board': {
      const b = getBoard(editingBoardId), def = DEFAULT_BOARDS.find(d => d.key === b?.key);
      if (def) { $('#b-name').value = t('board_' + def.key); $('#b-desc').value = t('boardDesc_' + def.key); $('#b-color').value = def.color; $('#b-wip').value = def.wip; $('#b-done').checked = def.isDone; updateBoardPreview(); }
      break; }
    case 'delete-board': {
      const b = getBoard(editingBoardId); if (!b) break;
      if (state.boards.length <= 1) { toast(t('cannotDeleteLast')); break; }
      const others = state.boards.filter(o => o !== b);
      const target = others.find(o => !o.isDone) || others[0];
      const n = state.tasks.filter(o => o.boardId === b.id).length;
      if (!confirm(t('confirmDeleteBoard', {name:bName(b), n, target:bName(target)}))) break;
      state.tasks.forEach(o => { if (o.boardId === b.id) { o.boardId = target.id; o.completedAt = target.isDone ? (o.completedAt || Date.now()) : null; } });
      state.boards = others;
      closeModal(); toast(t('boardDeleted'), true);
      break; }
  }
}
function addNote(x) {
  const ta = $('#noteText'), text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  x.notes.push({id:uid(), text, at:Date.now()}); touch(x); save(); refreshAll();

function addManualTime(x) {

  const ms = ((parseInt($('#manH').value) || 0) * 60 + (parseInt($('#manM').value) || 0)) * 60000;
  if (ms <= 0) return;
  let end;

/* ---------------- backup ---------------- */
function download(blob, name) {

/* ---------------- history: undo / redo ---------------- */
const undoStack = [], redoStack = [];
let lastData = null, lastChangeAt = 0, undoLenAtNew = -1;
// Only the work data is versioned – not language, filters or backup settings.
const dataOf = s => JSON.stringify({boards:s.boards, tasks:s.tasks, nextNum:s.nextNum, sprints:s.sprints});
function trackChange() {
  const cur = dataOf(state);
  if (lastData === null) { lastData = cur; return; }
  if (cur === lastData) return;
  const now = Date.now();
  // changes less than 1 s apart (e.g. continuous typing) count as one undo step
  if (now - lastChangeAt > 1000 || !undoStack.length) { undoStack.push(lastData); if (undoStack.length > 100) undoStack.shift(); }
  lastChangeAt = now;
  redoStack.length = 0;
  maybeSnapshot(lastData);
  lastData = cur;
  updateUndoButtons();
}
function setData(json) {
  const d = JSON.parse(json);
  const keep = {lang:state.lang, ui:state.ui, backup:state.backup, activeTimer:state.activeTimer,
                sync:state.sync, deleted:state.deleted, boardsUpdatedAt:state.boardsUpdatedAt,
                ...(d.sprints === undefined ? {sprints:state.sprints} : {})};   // older restore points / backups have no sprints
  state = normalize({...d, ...keep});
  state.ui.search = keep.ui.search;
  reconcile(true);   // undo/restore count as fresh changes for the next sync
  lastData = dataOf(state);
  lastChangeAt = 0;
  persist(); scheduleAutoBackup();
  if (modalKind === 'task') { if (getTask(openTaskId)) renderTaskModal(); else { newTaskId = null; closeModal(); } }
  else if (modalKind === 'board') closeModal();
  render();
}
function replaceData(json) {   // used by restores – can be undone with Ctrl+Z
  if (saveTimer) save();
  const cur = dataOf(state);
  undoStack.push(cur); if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0;
  setData(json);
}
function undo() {
  if (saveTimer) save();
  if (!undoStack.length) return;
  redoStack.push(dataOf(state));
  setData(undoStack.pop());
  toast(t('undoneMsg'));
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(dataOf(state));
  setData(redoStack.pop());
  toast(t('redoneMsg'));
}
function updateUndoButtons() {
  $$('.hist [data-act="undo"]').forEach(b => b.disabled = !undoStack.length);
  $$('.hist [data-act="redo"]').forEach(b => b.disabled = !redoStack.length);
}

/* ---------------- browser database (IndexedDB) ---------------- */
let dbPromise = null;
function getDB() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open('taskboard', 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('vmeta')) db.createObjectStore('vmeta', {keyPath:'id'});
      if (!db.objectStoreNames.contains('vdata')) db.createObjectStore('vdata');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
function idbTx(stores, mode, fn) {
  return getDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(stores, mode); let out;
    const r = fn(tx); if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  }));
}
const idbGet = k => idbTx('kv', 'readonly', tx => tx.objectStore('kv').get(k));
const idbSet = (k, v) => idbTx('kv', 'readwrite', tx => { tx.objectStore('kv').put(v, k); });
const idbDel = k => idbTx('kv', 'readwrite', tx => { tx.objectStore('kv').delete(k); });

/* ---------------- restore points (versions) ---------------- */
const HOUR = 3600000;
let versions = [], versionsReady = false, versionsFailed = false, lastSnapAt = 0;
async function loadVersions() {
  try {
    versions = (await idbTx('vmeta', 'readonly', tx => tx.objectStore('vmeta').getAll())) || [];
    versions.sort((a, b) => b.at - a.at);
    lastSnapAt = (versions.find(v => v.type === 'auto') || {}).at || 0;
    versionsReady = true;
    // take over the "before restore" copy from the previous app version
    const old = localStorage.getItem('taskboard.beforeRestore.v1');
    if (old) { const u = JSON.parse(old); localStorage.removeItem('taskboard.beforeRestore.v1'); await addVersion('restore', dataOf(u.data), u.at); }
    await pruneVersions();
  } catch (e) { console.error('Restore points unavailable', e); versionsFailed = true; }
  if (modalKind === 'backup') renderBackupModal();
}
function maybeSnapshot(prevJson) {
  if (!versionsReady) return;
  const now = Date.now();
  if (now - lastSnapAt < HOUR) return;
  lastSnapAt = now;
  addVersion('auto', prevJson, now);   // the state just before this change
}
async function addVersion(type, json, at = Date.now()) {
  if (!versionsReady) return false;
  const d = JSON.parse(json);
  const meta = {id:at + '-' + Math.random().toString(36).slice(2, 6), at, type, tasks:d.tasks.length, boards:d.boards.length};
  try {
    await idbTx(['vmeta', 'vdata'], 'readwrite', tx => { tx.objectStore('vmeta').put(meta); tx.objectStore('vdata').put(json, meta.id); });
    versions.push(meta); versions.sort((a, b) => b.at - a.at);
    await pruneVersions();
  } catch (e) { console.error('Could not save restore point', e); return false; }
  if (modalKind === 'backup') renderBackupModal();
  return true;
}
// Keep everything from the last 48 h, older automatic points: the first one of each day; nothing older than keepDays.
async function pruneVersions() {
  const now = Date.now(), maxAge = state.backup.keepDays * 86400000, seenDay = new Set(), del = [];
  [...versions].sort((a, b) => a.at - b.at).forEach(v => {
    const age = now - v.at;
    if (age > maxAge) { del.push(v); return; }
    if (v.type !== 'auto' || age <= 48 * HOUR) return;
    const day = ymd(new Date(v.at));
    if (seenDay.has(day)) del.push(v); else seenDay.add(day);
  });
  if (!del.length) return;
  await idbTx(['vmeta', 'vdata'], 'readwrite', tx => del.forEach(v => { tx.objectStore('vmeta').delete(v.id); tx.objectStore('vdata').delete(v.id); }));
  versions = versions.filter(v => !del.includes(v));
}
async function restoreVersion(id) {
  const v = versions.find(x => x.id === id); if (!v) return;
  let json = null;
  try { json = await idbTx('vdata', 'readonly', tx => tx.objectStore('vdata').get(id)); } catch (e) {}
  if (!json) { toast(t('restoreFailed')); return; }
  if (saveTimer) save();
  const cur = state;
  if (!confirm(t('confirmVersion', {when:fmtDateTime(v.at), n:v.tasks, b:v.boards, cn:cur.tasks.length, cb:cur.boards.length}))) return;
  await addVersion('restore', dataOf(state));
  replaceData(json);
  if (modalKind === 'backup') renderBackupModal();
  toast(t('versionRestored', {when:fmtDateTime(v.at)}), true);
}

/* ===== Jagger sync format "JG2" – shared with the Android app (keep both in step) =====
   package -> compact JSON -> zlib (deflate) -> Base45 (RFC 9285) -> chunks
   QR text:  JG2:<SID>:<i>:<n>:<CRC32 of compressed bytes, hex>:<base45 part>   (QR alphanumeric mode)
   A package holds either everything (base = 0) or only the changes since the last sync the
   other device confirmed (base = time of that sync, sender's clock). Deleted tasks travel as
   tombstones. Conflicts: per task, the newer version (updatedAt) wins.                      */

  const packBoard = b => [b.id, b.key ?? null, b.name ?? null, b.description ?? null, b.color, b.standard ? 1 : 0, b.isDone ? 1 : 0, b.wip || 0];
  const unpackBoard = b => ({id:b[0], key:b[1], name:b[2], description:b[3], color:b[4], standard:!!b[5], isDone:!!b[6], wip:b[7] || 0});
  const packTask = x => [x.id, x.num, x.title, x.description, x.boardId, x.priority, x.startDate || '', x.deadline || '', x.estimate || 0,
    x.bottleneck ? 1 : 0, x.bottleneckReason || '',
    x.subtasks.map(s => [s.text, s.done ? 1 : 0]),
    x.notes.map(n => [n.text, S(n.at)]),
    x.time.map(e => [S(e.start), Math.max(0, S(e.end) - S(e.start)), e.manual ? 1 : 0]),
    S(x.createdAt), S(x.updatedAt), x.completedAt ? S(x.completedAt) : 0];
  const unpackTask = x => ({id:x[0], num:x[1], title:x[2], description:x[3], boardId:x[4], priority:x[5], startDate:x[6], deadline:x[7], estimate:x[8],
    bottleneck:!!x[9], bottleneckReason:x[10],
    subtasks:x[11].map((s, i) => ({id:x[0] + '-s' + i, text:s[0], done:!!s[1]})),
    notes:x[12].map((n, i) => ({id:x[0] + '-n' + i, text:n[0], at:MS(n[1])})),
    time:x[13].map((e, i) => ({id:x[0] + '-t' + i, start:MS(e[0]), end:MS(e[0] + e[1]), manual:!!e[2]})),
    createdAt:MS(x[14]), updatedAt:MS(x[15]), completedAt:x[16] ? MS(x[16]) : null});

    const st = {added:0, updated:0, removed:0, keptLocal:0, renumbered:0, moved:0};

      const incoming = new Set(pkg.tasks.map(x => x.id));

      st.added = pkg.tasks.length;

        if (!L) {

          tomb.delete(t.id); const c = clone(t); res.tasks.push(c); byId.set(c.id, c); st.added++;
        } else if (t.updatedAt > L.updatedAt) { Object.assign(L, clone(t)); st.updated++; }
        else st.keptLocal++;
      }
      for (const d of pkg.deleted) {
        const L = byId.get(d.id);
        if (L && L.updatedAt <= d.at) { res.tasks = res.tasks.filter(x => x !== L); byId.delete(d.id); st.removed++; }
        if (!L || L.updatedAt <= d.at) setTomb(d.id, d.at);
      }
      if ((pkg.boardsAt || 0) > res.boardsUpdatedAt) { res.boards = clone(pkg.boards); res.boardsUpdatedAt = pkg.boardsAt; }
    }
    if (!res.boards.length) res.boards = clone(local.boards);
    // tasks on boards that no longer exist go to the first open board
    const ids = new Set(res.boards.map(b => b.id)), fallback = (res.boards.find(b => !b.isDone) || res.boards[0]).id;
    const bump = x => { x.updatedAt = Math.max(now, x.updatedAt + 1000); };   // must be strictly newer than any copy elsewhere
    res.tasks.forEach(x => { if (!ids.has(x.boardId)) { x.boardId = fallback; bump(x); st.moved++; } });
    // the same task number created on both devices: give the newcomer a fresh number
    let next = Math.max(local.nextNum || 1, pkg.nextNum || 1, ...res.tasks.map(x => (x.num || 0) + 1));
    const localIds = new Set(local.tasks.map(x => x.id)), owner = new Map();
    [...res.tasks].sort((a, b) => (localIds.has(b.id) - localIds.has(a.id))).forEach(x => {
      if (owner.has(x.num) && owner.get(x.num) !== x.id) { x.num = next++; bump(x); st.renumbered++; }
      owner.set(x.num, x.id);
    });

  function updatePeer(peers, pkg, myDevice, now = Date.now(), replaced = false) {

})();

/* ---------------- change tracking for sync (timestamps + tombstones) ---------------- */
let recTasks = null, recBoards = '';
const taskSig = x => { const {updatedAt, ...rest} = x; return JSON.stringify(rest); };
function initRecon() { recTasks = new Map(state.tasks.map(x => [x.id, taskSig(x)])); recBoards = JSON.stringify(state.boards); }
// Any change to a task (edit, undo, restore…) marks it as changed now; vanished tasks get a tombstone.
function reconcile(bump) {
  if (!recTasks) initRecon();
  const now = Date.now(), cur = new Map();
  for (const x of state.tasks) {
    const sig = taskSig(x); cur.set(x.id, sig);
    if (bump && recTasks.get(x.id) !== sig) x.updatedAt = Math.max(now, x.updatedAt || 0);
  }
  if (bump) {
    const tomb = new Map(state.deleted.map(d => [d.id, d.at]));
    for (const id of recTasks.keys()) if (!cur.has(id)) tomb.set(id, now);
    for (const id of cur.keys()) tomb.delete(id);
    state.deleted = [...tomb].map(([id, at]) => ({id, at}));
    if (JSON.stringify(state.boards) !== recBoards) state.boardsUpdatedAt = now;
  }
  recTasks = cur; recBoards = JSON.stringify(state.boards);
}


/* ---------------- sprints (whole tasks; local to this PC – a phone sync never removes them) ---------------- */
const sprintUI = {view:'list', id:null, q:''};
const getSprint = id => state.sprints.find(s => s.id === id);
const activeSprint = () => state.sprints.find(s => s.status === 'active');
const sprintTasks = id => state.tasks.filter(x => x.sprintId === id);
const inSprintScope = x => { const s = state.ui.sprint; return s === 'all' ? true : s === 'none' ? !x.sprintId : x.sprintId === s; };
const fmtShort = s => s ? parseYmd(s).toLocaleDateString(locale(), {day:'2-digit', month:'2-digit'}) : '?';
const sprintRange = sp => `${fmtShort(sp.start)} – ${sp.end ? fmtDate(sp.end) : '?'}`;
function sprintStats(sp) {
  const ts = sprintTasks(sp.id), done = ts.filter(isDoneTask).length;
  return {total:ts.length, done, open:ts.length - done, est:ts.reduce((a, x) => a + (x.estimate || 0), 0), tracked:ts.reduce((a, x) => a + trackedMs(x), 0)};
}
function sprintTiming(sp) {   // text like "5 days left"
  const today = parseYmd(todayStr()).getTime(), day = s => s ? Math.round((parseYmd(s).getTime() - today) / 86400000) : null;
  if (sp.status === 'closed') return t('sprintClosedOn', {date:fmtDate(ymd(new Date(sp.closedAt || Date.now())))});
  const toStart = day(sp.start), toEnd = day(sp.end);
  if (sp.status === 'planned') return toStart === null ? '' : toStart > 0 ? t('sprintStartsIn', {n:toStart}) : t('sprintReadyToStart');
  if (toEnd === null) return '';
  return toEnd > 0 ? t('sprintDaysLeft', {n:toEnd}) : toEnd === 0 ? t('sprintEndsToday') : t('sprintOverdue', {n:-toEnd});
}
const statusLabel = sp => t(sp.status === 'active' ? 'sprintActive' : sp.status === 'closed' ? 'sprintDone' : 'sprintPlanned');
function sortedSprints() {
  const rank = {active:0, planned:1, closed:2};
  return [...state.sprints].sort((a, b) => (rank[a.status] - rank[b.status]) ||
    (a.status === 'closed' ? (b.closedAt || 0) - (a.closedAt || 0) : (a.start || '').localeCompare(b.start || '')));
}
function newSprint() {
  const nums = state.sprints.map(s => +((/(\d+)\s*$/.exec(s.name) || [])[1] || 0));
  const lastEnd = state.sprints.map(s => s.end).filter(Boolean).sort().pop();
  let start = todayStr();
  if (lastEnd && lastEnd >= start) { const d = parseYmd(lastEnd); d.setDate(d.getDate() + 1); start = ymd(d); }
  const e = parseYmd(start); e.setDate(e.getDate() + 13);
  const sp = {id:'s_' + uid(), name:t('sprintWord') + ' ' + (Math.max(0, ...nums) + 1), goal:'', start, end:ymd(e), status:'planned', createdAt:Date.now(), closedAt:null, result:null};
  state.sprints.push(sp);
  return sp;
}
function startSprint(sp) {
  const other = activeSprint();
  if (other && other !== sp) { toast(t('sprintOneActive', {name:other.name})); return; }
  const today = todayStr();
  // starting early (or late) keeps the planned length of the sprint
  const len = sp.start && sp.end && sp.end >= sp.start ? Math.round((parseYmd(sp.end) - parseYmd(sp.start)) / 86400000) : 13;
  if (!sp.start || sp.start > today) { sp.start = today; const e = parseYmd(today); e.setDate(e.getDate() + len); sp.end = ymd(e); }
  if (!sp.end || sp.end < sp.start) { const e = parseYmd(sp.start); e.setDate(e.getDate() + 13); sp.end = ymd(e); }
  sp.status = 'active'; sp.closedAt = null; sp.result = null;
  state.ui.sprint = sp.id;
  save(); render(); toast(t('sprintStarted', {name:sp.name}));
}
function completeSprint(sp, target, startNext) {
  const ts = sprintTasks(sp.id), open = ts.filter(x => !isDoneTask(x));
  let dest = target;
  if (target === '__new') { const n = newSprint(); dest = n.id; }
  open.forEach(x => { x.sprintId = dest || ''; touch(x); });
  sp.status = 'closed'; sp.closedAt = Date.now(); sp.result = {total:ts.length, done:ts.length - open.length, moved:open.length};
  const next = dest ? getSprint(dest) : null;
  if (next && startNext && next.status === 'planned' && !activeSprint()) startSprint(next);
  state.ui.sprint = next ? next.id : 'all';
  save(); render(); toast(t('sprintCompleted', {name:sp.name, done:sp.result.done, total:sp.result.total}), true);
}
function deleteSprint(sp) {
  if (!confirm(t('sprintConfirmDelete', {name:sp.name, n:sprintTasks(sp.id).length}))) return;
  state.tasks.forEach(x => { if (x.sprintId === sp.id) { x.sprintId = ''; touch(x); } });
  state.sprints = state.sprints.filter(s => s !== sp);
  if (state.ui.sprint === sp.id) state.ui.sprint = 'all';
  sprintUI.view = 'list'; save(); render(); renderSprintModal(); toast(t('sprintDeleted'), true);
}

function burndownSvg(sp) {
  if (!sp.start || !sp.end) return '';
  const s = parseYmd(sp.start), e = parseYmd(sp.end), days = Math.round((e - s) / 86400000) + 1;
  const ts = sprintTasks(sp.id), N = ts.length;
  if (days < 2 || days > 120 || !N || s > parseYmd(todayStr())) return '';
  const last = Math.min(e.getTime(), parseYmd(sp.status === 'closed' && sp.closedAt ? ymd(new Date(sp.closedAt)) : todayStr()).getTime());
  const W = 600, H = 170, L = 34, R = 10, T = 10, B = 26;
  const X = i => L + i * (W - L - R) / (days - 1), Y = v => T + (H - T - B) * (1 - v / N);
  const pts = [];
  for (let i = 0; i < days; i++) {
    const dayStart = new Date(s); dayStart.setDate(dayStart.getDate() + i);
    if (dayStart.getTime() > last) break;
    const end = dayStart.getTime() + 86400000;
    const remaining = ts.filter(x => !(isDoneTask(x) && (x.completedAt || 0) < end)).length;
    pts.push(`${X(i).toFixed(1)},${Y(remaining).toFixed(1)}`);
  }
  const grid = [0, 0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${Y(N * f)}" y2="${Y(N * f)}" class="bd-grid"/><text x="${L - 6}" y="${Y(N * f) + 4}" text-anchor="end" class="bd-txt">${Math.round(N * f)}</text>`).join('');
  return `<div class="burndown"><div class="bd-head"><b>${esc(t('sprintBurndown'))}</b>
      <span><i class="bd-key ideal"></i>${esc(t('sprintIdeal'))} <i class="bd-key real"></i>${esc(t('sprintRemaining'))}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('sprintBurndown'))}">${grid}
      <line x1="${X(0)}" y1="${Y(N)}" x2="${X(days - 1)}" y2="${Y(0)}" class="bd-ideal"/>
      ${pts.length > 1 ? `<polyline points="${pts.join(' ')}" class="bd-real"/>` : ''}
      ${pts.length ? `<circle cx="${pts[pts.length - 1].split(',')[0]}" cy="${pts[pts.length - 1].split(',')[1]}" r="4" class="bd-dot"/>` : ''}
      <text x="${L}" y="${H - 6}" class="bd-txt">${esc(fmtShort(sp.start))}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end" class="bd-txt">${esc(fmtShort(sp.end))}</text></svg></div>`;
}

// open tasks that can be added: without a sprint, or – when searching – also from other sprints
function sprintCandidates(sp) {
  const q = sprintUI.q.trim().toLowerCase();
  return state.tasks.filter(x => x.sprintId !== sp.id && !isDoneTask(x) && (q ? (x.title + ' ' + numStr(x)).toLowerCase().includes(q) : !x.sprintId))
    .sort((a, b) => a.priority - b.priority || dlTime(a) - dlTime(b)).slice(0, 60);
}

    : `<div class="empty">${esc(t('sprintNoCandidates'))}</div>`;

function openSprints(view, id) { sprintUI.view = view || 'list'; sprintUI.id = id || null; sprintUI.q = ''; renderSprintModal(); }

/* ---------------- sync dialog ---------------- */
const syncUI = {tab:'send', full:false, small:false, speed:450, paused:false, codes:[], mats:[], idx:0, timer:null, info:null,
                asm:null, status:[], pending:null, done:null, busy:false, preparing:false};
const localSyncView = () => ({device:state.sync.device, deviceName:'PC', boards:state.boards, tasks:state.tasks, nextNum:state.nextNum,
                              deleted:state.deleted, boardsUpdatedAt:state.boardsUpdatedAt, peers:state.sync.peers});
const peerList = () => Object.values(state.sync.peers);
const canDelta = () => peerList().length > 0 && peerList().every(p => p.ackFromPeer);

function qrMatrix(text) {
  const q = qrcode(0, 'M'); q.addData(text, 'Alphanumeric'); q.make();
  const k = q.getModuleCount(), d = new Uint8Array(k * k);
  for (let r = 0; r < k; r++) for (let c = 0; c < k; c++) d[r * k + c] = q.isDark(r, c) ? 1 : 0;
  return {k, d};
}
function drawMatrix(ctx, m, x, y, size) {
  const px = Math.max(1, Math.floor(size / (m.k + 8))), off = Math.floor((size - px * (m.k + 8)) / 2) + 4 * px;
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, size, size); ctx.fillStyle = '#000';
  for (let r = 0; r < m.k; r++) for (let c = 0; c < m.k; c++) if (m.d[r * m.k + c]) ctx.fillRect(x + off + c * px, y + off + r * px, px, px);
}
function openSync(tab) {
  if (saveTimer) save();
  Object.assign(syncUI, {tab:tab || 'send', paused:false, asm:JSYNC.assembler(), status:[], pending:null, done:null, codes:[], mats:[], info:null});
  syncUI.full = !canDelta();
  renderSyncModal();
  if (syncUI.tab === 'send') prepareSend();
}
async function prepareSend() {
  stopAnim(); syncUI.preparing = true; renderSyncModal();
  try {
    const pkg = JSYNC.buildPackage(localSyncView(), syncUI.full || !canDelta());
    const enc = await JSYNC.encode(pkg, syncUI.small ? 500 : 800);
    Object.assign(syncUI, {codes:enc.codes, mats:enc.codes.map(qrMatrix), idx:0,
      info:{full:!pkg.base, tasks:pkg.tasks.length, deleted:pkg.deleted.length, bytes:enc.bytes}});
  } catch (e) { console.error(e); toast('Sync error: ' + e.message); }
  syncUI.preparing = false;
  if (modalKind === 'sync' && syncUI.tab === 'send') { renderSyncModal(); startAnim(); }
}
function stopAnim() { clearInterval(syncUI.timer); syncUI.timer = null; }
function startAnim() {
  stopAnim(); drawCurrentCode();
  syncUI.timer = setInterval(() => {
    if (syncUI.paused || syncUI.mats.length < 2) return;
    syncUI.idx = (syncUI.idx + 1) % syncUI.mats.length; drawCurrentCode();
  }, syncUI.speed);
}
function drawCurrentCode() {
  const c = $('#qrCanvas'); if (!c || !syncUI.mats.length) return;
  const css = Math.min(560, (c.parentElement.clientWidth || 560) - 24), size = Math.floor(css * (window.devicePixelRatio || 1));
  if (c.width !== size) { c.width = size; c.height = size; }
  drawMatrix(c.getContext('2d'), syncUI.mats[syncUI.idx], 0, 0, size);
  const n = syncUI.mats.length;
  $('#qrCount').textContent = t('syncCodeOf', {i:syncUI.idx + 1, n});
  $('#qrBar').style.width = ((syncUI.idx + 1) / n * 100) + '%';
}
function saveSyncImage() {   // all codes in one PNG (the phone can read it from the gallery)
  const ms = syncUI.mats; if (!ms.length) return;
  const n = ms.length, cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), tile = 720;
  const cv = document.createElement('canvas'); cv.width = cols * tile; cv.height = rows * tile + 90;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ms.forEach((m, i) => drawMatrix(ctx, m, (i % cols) * tile, Math.floor(i / cols) * tile, tile));
  ctx.fillStyle = '#000'; ctx.font = '28px "Segoe UI", Arial, sans-serif';
  ctx.fillText('Jagger – ' + fmtDateTime(Date.now()) + ' – ' + t('syncCodes', {n}), 24, rows * tile + 55);
  cv.toBlob(b => download(b, 'Jagger_Sync_' + todayStr() + '.png'), 'image/png');
}

// reading QR images from the phone
async function jaggerScanImage(getRegion, W, H, onCode, isDone) {
  const attempt = (x, y, w, h, max) => {
    const r = getRegion(x, y, w, h, max);
    const res = jsQR(r.data, r.width, r.height, {inversionAttempts:'attemptBoth'});
    return res && res.data ? (onCode(res.data), true) : false;
  };
  const cell = (x, y, w, h) => {
    if (attempt(x, y, w, h, 1100)) return;
    const s = Math.min(w, h);
    if (attempt(x, y, w, h, Math.round(s * 0.7))) return;
    const i = s * 0.03;
    if (attempt(x + i, y + i, w - 2 * i, h - 2 * i, Math.round(s * 0.85))) return;
    attempt(x, y, w, h, Math.round(s * 0.5));
  };
  attempt(0, 0, W, H, 1400);
  for (let c = 1; c <= 6 && !isDone(); c++) {
    const tile = W / c, rows = Math.floor(H / tile + 0.02);
    for (let r = 0; r < rows && !isDone(); r++)
      for (let k = 0; k < c && !isDone(); k++) { cell(k * tile, r * tile, tile, tile); await new Promise(res => setTimeout(res, 0)); }
  }
}
async function scanImageFile(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 4000 / Math.max(bmp.width, bmp.height)), W = Math.round(bmp.width * k), H = Math.round(bmp.height * k);
  const src = document.createElement('canvas'); src.width = W; src.height = H; src.getContext('2d').drawImage(bmp, 0, 0, W, H);
  const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d', {willReadFrequently:true});
  const getRegion = (x, y, w, h, max) => {
    const s = Math.min(1, max / Math.max(w, h)), ow = Math.max(1, Math.round(w * s)), oh = Math.max(1, Math.round(h * s));
    tmp.width = ow; tmp.height = oh; tctx.fillStyle = '#fff'; tctx.fillRect(0, 0, ow, oh);
    tctx.drawImage(src, x, y, w, h, 0, 0, ow, oh);
    return tctx.getImageData(0, 0, ow, oh);

}
function scanProgressHtml() {

function updateScanProgress() { const el = $('#scanProgress'); if (el) el.innerHTML = scanProgressHtml(); }
function addSyncStatus(msg, kind) { syncUI.status.push({msg, kind}); if (syncUI.status.length > 6) syncUI.status.shift(); }
async function processSyncFiles(list) {
  const files = [...list]; if (!files.length || syncUI.busy) return;
  syncUI.busy = true; syncUI.done = null; syncUI.status = []; renderSyncModal();
  for (const f of files) {
    if (/json/i.test(f.type) || /\.json$/i.test(f.name)) {
      let data = null; try { data = JSON.parse(await f.text()); } catch (e) {}
      if (data && data.kind === 'sync') { try { setPending(JSYNC.fromWire(data)); } catch (e) { addSyncStatus(t('syncBadFile', {name:f.name}), 'err'); } }
      else if (data && Array.isArray(data.boards) && Array.isArray(data.tasks)) { syncUI.busy = false; closeModal(); restoreBackup(f); return; }
      else addSyncStatus(t('syncBadFile', {name:f.name}), 'err');
      continue;
    }
    if (!/^image\//.test(f.type)) { addSyncStatus(t('syncBadFile', {name:f.name}), 'err'); continue; }
    addSyncStatus(t('syncReading', {name:f.name || 'image'})); renderSyncModal();
    try { await scanImageFile(f); } catch (e) { console.error(e); addSyncStatus(t('syncBadFile', {name:f.name}), 'err'); }
  }
  const s = syncUI.asm.current;
  if (!syncUI.pending) {

      catch (e) { console.error(e); addSyncStatus(t('syncCorrupt'), 'err'); syncUI.asm = JSYNC.assembler(); }
    } else if (s) addSyncStatus(t('syncMissing', {list:syncUI.asm.missing(s).join(', ')}), 'warn');

}

  syncUI.pending = {pkg, preview:JSYNC.applyPackage(localSyncView(), pkg, 'merge').stats,
    warn:JSYNC.missingBase(state.sync.peers, pkg), canReplace:!pkg.base};
  syncUI.asm = JSYNC.assembler(); syncUI.status = [];
}
async function applyPending(mode) {
  const p = syncUI.pending; if (!p) return;
  if (mode === 'replace' && !confirm(t('syncConfirmReplace', {n:state.tasks.length}))) return;
  if (saveTimer) save();
  await addVersion('restore', dataOf(state));
  const {data, stats} = JSYNC.applyPackage(localSyncView(), p.pkg, mode);
  undoStack.push(dataOf(state)); if (undoStack.length > 100) undoStack.shift(); redoStack.length = 0;
  Object.assign(state, {boards:data.boards, tasks:data.tasks, nextNum:data.nextNum, deleted:data.deleted, boardsUpdatedAt:data.boardsUpdatedAt});
  JSYNC.updatePeer(state.sync.peers, p.pkg, state.sync.device, Date.now(), mode === 'replace');
  const ids = new Set(state.tasks.map(x => x.id));
  Object.values(state.sync.peers).forEach(pr => { for (const k in pr.seen) if (!ids.has(k)) delete pr.seen[k]; });
  state = normalize(state);
  lastData = dataOf(state); lastChangeAt = 0; reconcile(false);
  persist(); scheduleAutoBackup();
  syncUI.pending = null; syncUI.done = stats;
  render(); renderSyncModal(); toast(t('syncDoneToast'), true);
}

const supportsFile = typeof window !== 'undefined' && 'showSaveFilePicker' in window;
const supportsDir = typeof window !== 'undefined' && 'showDirectoryPicker' in window;
const JSON_TYPES = [{description:'Jagger backup (JSON)', accept:{'application/json':['.json']}}];
let autoHandle = null, autoStatus = 'off', autoTimer = null, lastPruneDay = '';   // autoStatus: off | ok | paused | error

const backupPayload = () => JSON.stringify({...state, backupMeta:{app:'Jagger', format:1, savedAt:new Date().toISOString()}}, null, 2);
function agoText(ms) {
  const days = Math.floor((parseYmd(todayStr()) - parseYmd(ymd(new Date(ms)))) / 86400000);
  return days <= 0 ? t('agoToday') : days === 1 ? t('agoYesterday') : t('agoDays', {n:days});
}
function markBackedUp(type) {
  state.backup.lastAt = Date.now(); state.backup.lastType = type; state.backup.snoozeUntil = 0;
  persist(); renderBackupBar();
  if (modalKind === 'backup') renderBackupModal();
}
async function saveBackupNow() {
  if (saveTimer) save();
  const json = backupPayload(), name = 'Jagger_Backup_' + todayStr() + '.json';
  if (supportsFile) {
    try {
      const h = await window.showSaveFilePicker({suggestedName:name, types:JSON_TYPES});
      const w = await h.createWritable(); await w.write(json); await w.close();
    } catch (e) {
      if (e.name === 'AbortError') return;
      console.error(e);
      download(new Blob([json], {type:'application/json'}), name);
    }
  } else download(new Blob([json], {type:'application/json'}), name);
  markBackedUp('manual'); toast(t('backupDone'));
}
function restoreBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let data;
    try {
      data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.boards) || !Array.isArray(data.tasks)) throw new Error('invalid');
    } catch (e) {
      if (data && data.kind === 'sync') { try { const pkg = JSYNC.fromWire(data); openSync('recv'); setPending(pkg); renderSyncModal(); } catch (err) { toast(t('restoreFailed')); } return; }
      toast(t('restoreFailed')); return;
    }
    if (saveTimer) save();
    const saved = data.backupMeta?.savedAt ? Date.parse(data.backupMeta.savedAt) : file.lastModified;
    if (!confirm(t('confirmRestore', {when:fmtDateTime(saved || Date.now()), b:data.boards.length, n:data.tasks.length, cb:state.boards.length, cn:state.tasks.length}))) return;
    await addVersion('restore', dataOf(state));
    replaceData(dataOf(data));
    if (modalKind === 'backup') renderBackupModal();
    toast(t('restored'), true);
  };
  r.readAsText(file);
}

/* automatic daily files in a folder (File System Access API – Edge/Chrome) */
function setAutoStatus(s) { autoStatus = s; renderBackupBar(); if (modalKind === 'backup') renderBackupModal(); }
function scheduleAutoBackup() {
  if (!state.backup.autoEnabled || !autoHandle || (autoStatus !== 'ok' && autoStatus !== 'error')) return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(writeAutoBackup, 3000);
}
async function writeAutoBackup() {
  if (!autoHandle) return false;
  try {
    if (await autoHandle.queryPermission({mode:'readwrite'}) !== 'granted') { setAutoStatus('paused'); return false; }
    const fh = await autoHandle.getFileHandle('Jagger_' + todayStr() + '.json', {create:true});
    const w = await fh.createWritable(); await w.write(backupPayload()); await w.close();
    state.backup.lastAt = Date.now(); state.backup.lastType = 'auto'; persist();
    await pruneFolder();
    setAutoStatus('ok');
    return true;
  } catch (e) { console.error('Automatic backup failed', e); setAutoStatus('error'); return false; }
}
async function pruneFolder() {   // only removes the app's own daily files (Jagger_YYYY-MM-DD.json, older Taskboard_YYYY-MM-DD.json)
  if (lastPruneDay === todayStr()) return;
  lastPruneDay = todayStr();
  const limit = parseYmd(todayStr()).getTime() - state.backup.keepDays * 86400000, old = [];
  try {
    for await (const [name, h] of autoHandle.entries()) {
      const m = /^(?:Jagger|Taskboard)_(\d{4}-\d{2}-\d{2})\.json$/.exec(name);
      if (m && h.kind === 'file' && parseYmd(m[1]).getTime() < limit) old.push(name);
    }
    for (const name of old) await autoHandle.removeEntry(name);
  } catch (e) { console.warn('Could not tidy up old backup files', e); }
}
async function initAutoBackup() {
  try { await idbDel('autoHandle'); } catch (e) {}          // single-file mode of the previous version
  if (!supportsDir || !state.backup.autoEnabled) return;
  try { autoHandle = await idbGet('autoDir'); } catch (e) { autoHandle = null; }
  if (!autoHandle) { state.backup.autoEnabled = false; state.backup.autoFile = ''; persist(); renderBackupBar(); return; }
  try {
    if (await autoHandle.queryPermission({mode:'readwrite'}) === 'granted') { autoStatus = 'ok'; await writeAutoBackup(); }
    else setAutoStatus('paused');
  } catch (e) { setAutoStatus('error'); }
}
async function setupAutoBackup() {
  try {
    const h = await window.showDirectoryPicker({id:'taskboard-backup', mode:'readwrite'});
    autoHandle = h; lastPruneDay = '';
    await idbSet('autoDir', h);
    state.backup.autoEnabled = true; state.backup.autoFile = h.name; persist();
    autoStatus = 'ok';
    if (await writeAutoBackup()) toast(t('autoOn'));
  } catch (e) { if (e.name !== 'AbortError') { console.error(e); toast(t('autoFailed')); } }
}
async function resumeAutoBackup() {
  if (!autoHandle) { setupAutoBackup(); return; }
  try {
    if (await autoHandle.requestPermission({mode:'readwrite'}) !== 'granted') { toast(t('autoDenied')); return; }
    autoStatus = 'ok';
    if (await writeAutoBackup()) toast(t('autoResumed'));
  } catch (e) { console.error(e); setAutoStatus('error'); }
}
async function disableAutoBackup() {
  clearTimeout(autoTimer);
  autoHandle = null; state.backup.autoEnabled = false; state.backup.autoFile = ''; persist();
  try { await idbDel('autoDir'); } catch (e) {}
  setAutoStatus('off'); toast(t('autoOff'));
}

    else if (f === 'bottleneck') {
      x.bottleneck = el.checked; touch(x);
      const r = $('[data-field="bottleneckReason"]'); r.hidden = !el.checked; $('#blockBox').classList.toggle('blocked', el.checked);
      if (el.checked) r.focus();
      save(); render();
    }
    else if (f === 'startDate' || f === 'deadline') { x[f] = el.value; touch(x); $('#dueInfo').outerHTML = dueInfoHtml(x); save(); render(); }
    else if (f === 'estimate') { $('#timeSection').outerHTML = timeSectionHtml(x); save(); render(); }
  });

  document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('manual')) manualOpen = e.target.open; }, true);

  document.addEventListener('keydown', e => {
    const el = e.target;
    if (el.dataset && el.dataset.quick && e.key === 'Enter') {
      const v = el.value.trim(), bid = el.dataset.quick;
      if (v) { addTask(bid, v); render(); const n = $('[data-quick="' + bid + '"]'); if (n) n.focus(); }
      return;
    }
    if (el.id === 'addSub' && e.key === 'Enter') {
      const x = getTask(openTaskId), v = el.value.trim();
      if (x && v) { x.subtasks.push({id:uid(), text:v, done:false}); touch(x); save(); refreshAll(); $('#addSub').focus(); }
      return;
    }
    if (el.id === 'noteText' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { const x = getTask(openTaskId); if (x) addNote(x); return; }
    if (el.classList && el.classList.contains('sub-text') && e.key === 'Enter') { el.blur(); return; }
    if (el.id === 'f-title' && e.key === 'Enter') { $('#f-desc').focus(); return; }
    if (el.id === 'b-name' && e.key === 'Enter') { saveBoard(); return; }
    if (el.id === 'dropZone' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); $('#syncFile').click(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !isTyping(el)) {
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
    }
    if (e.key === 'Escape') { if (modalKind) { e.preventDefault(); closeModal(); } return; }
    if (el.classList && el.classList.contains('card') && e.key === 'Enter') { openTask(el.dataset.task); return; }
    if (!modalKind && !isTyping(el) && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); newTask(); }
  });

  document.addEventListener('dragstart', e => {
    const c = e.target.closest && e.target.closest('.card'); if (!c) return;
    dragId = c.dataset.task; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
    requestAnimationFrame(() => c.classList.add('dragging'));
  });
  document.addEventListener('dragend', () => { $$('.dragging').forEach(c => c.classList.remove('dragging')); clearDrag(); dragId = null; });
  document.addEventListener('dragover', e => {
    if (!dragId) return;
    const col = e.target.closest && e.target.closest('.col'); if (!col) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.col.drag-over').forEach(c => { if (c !== col) c.classList.remove('drag-over'); });
    col.classList.add('drag-over');
    const body = $('.col-body', col);
    const before = state.ui.sort === 'manual' ? beforeCard(body, e.clientY) : null;
    let m = $('.drop-marker');
    if (!m) { m = document.createElement('div'); m.className = 'drop-marker'; }
    if (before) { if (m.nextElementSibling !== before) body.insertBefore(m, before); }
    else if (m.parentNode !== body || m.nextElementSibling) body.appendChild(m);
  });
  document.addEventListener('drop', e => {
    if (!dragId) return;
    const col = e.target.closest && e.target.closest('.col'); if (!col) return;
    e.preventDefault();
    const before = state.ui.sort === 'manual' ? beforeCard($('.col-body', col), e.clientY) : null;
    moveTask(dragId, col.dataset.board, before ? before.dataset.task : null);
    dragId = null; clearDrag(); save(); render();
  });

  // files dragged onto the window: never navigate away; in the sync dialog, read them
  document.addEventListener('dragover', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault(); const z = $('#dropZone'); if (z) z.classList.add('over');
  });
  document.addEventListener('dragleave', e => { const z = $('#dropZone'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  document.addEventListener('drop', e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    if (modalKind === 'sync' && syncUI.tab === 'recv' && !syncUI.pending) processSyncFiles(e.dataTransfer.files);
  });
  document.addEventListener('paste', e => {
    if (modalKind !== 'sync' || syncUI.tab !== 'recv' || syncUI.pending) return;
    const files = Array.from(e.clipboardData ? e.clipboardData.files : []);
    if (files.length) { e.preventDefault(); processSyncFiles(files); }
  });
  window.addEventListener('resize', () => { if (modalKind === 'sync' && syncUI.tab === 'send') drawCurrentCode(); });
  window.addEventListener('beforeunload', () => { if (saveTimer) save(); });
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try { state = normalize(JSON.parse(e.newValue)); lastData = dataOf(state); initRecon(); applyI18n(); render(); if (modalKind === 'task') renderTaskModal(); } catch (err) {}
  });

  lastData = dataOf(state);
  initRecon();
  applyI18n();
  render();
  save();
  loadVersions();
  initAutoBackup();
  setInterval(tick, 1000);
  tick();
}
if (typeof document !== 'undefined' && document.getElementById('boards')) init();
</script>
</body>
</html>
